# =====================================================================
# Configuração do agente de vagas. Tudo que muda o comportamento fica
# aqui: edite este arquivo, não o código.
# Padrões são expressões regulares (case-insensitive).
# =====================================================================

profile:
  career_start: "2021-01-01"     # início da experiência formal (estágio Whirlpool)

run:
  max_per_run: 10                # 2 execuções/dia -> no máximo 20 vagas/dia
  max_age_days: 7                # ignora vagas publicadas há mais de N dias
  timezone: "America/Sao_Paulo"
  sources: [remotive, remoteok, weworkremotely, himalayas]

sheets:
  monitor_tab: "MONITOR"
  triagem_tab: "TRIAGEM"

# ---------------------------------------------------------------------
# Filtro de título: precisa casar com pelo menos um "include"
# e com nenhum "exclude".
# ---------------------------------------------------------------------
titles:
  include:
    - 'data analy'
    - '\bbi\b'
    - 'business intelligence'
    - 'power\s?bi'
    - 'analytics engineer'
    - '\breporting\b'
    - 'insights? analyst'
    - 'data specialist'
    - '\betl\b'
    - 'data engineer'
    - 'data quality'
    - 'business analyst'
    - 'analytics (analyst|specialist|consultant)'
    - '\btableau\b'
    - '\bsql\b'
    - 'data visuali[sz]'
  exclude:
    - '\bsenior\b'
    - '\bsr\b\.?'
    - '\blead\b'
    - '\bprincipal\b'
    - '\bstaff\b'
    - '\bhead of\b'
    - '\bdirector\b'
    - '\bmanager\b'
    - '\bvp\b'
    - '\bintern(ship)?\b'
    - '\bscientist\b'

# ---------------------------------------------------------------------
# Elegibilidade (você não tem autorização de trabalho fora do Brasil)
# ---------------------------------------------------------------------
eligibility:
  # Localização estruturada que aceita candidatos do Brasil
  location_ok:
    - 'worldwide'
    - 'anywhere'
    - '\bglobal\b'
    - 'americas'
    - '\blatam\b'
    - 'latin america'
    - 'south america'
    - 'brazil'
    - 'brasil'
  # Localização genérica, sem restrição explícita -> checa a descrição
  location_generic:
    - '^$'
    - '^remote$'
    - '^remote only$'
    - '^100% remote$'
    - '^remoto$'
  red_flags:
    - reason: 'Exige residência local'
      pattern: '\b(must|need to|required to|should)\s+(be\s+)?(currently\s+)?(based|located|living|residing|reside|live)\s+in\b'
    - reason: 'Exige autorização de trabalho'
      pattern: '\b(authori[sz]ed|eligib\w+|legally\s+(able|permitted|entitled))\s+to\s+work\s+in\b'
    - reason: 'Exige autorização de trabalho'
      pattern: '\bright to work in\b'
    - reason: 'Exige cidadania/clearance'
      pattern: '\b(security clearance|green card|citizens?\s+only|citizenship\s+(is\s+)?required)\b'
    - reason: 'Restrito a residentes'
      pattern: '\b(only|exclusively)\s+(open to|accepting|considering|hiring)\s+(\w+\s+){0,2}(in|from|based|located|residing)\b'
    - reason: 'Restrito a residentes'
      pattern: '\b(us|u\.s\.|usa|uk|eu|canada|canadian|american|british)[- ](based|residents?|citizens?)\s+only\b'
    - reason: 'Vínculo W-2 (só EUA)'
      pattern: '\bw-?2\s+(only|employee|position|role)\b'
  review_flags:
    - reason: 'Menciona híbrido/presencial'
      pattern: '\b(hybrid|on-?site|in[- ]office)\b'
    - reason: 'Menciona visto/sponsorship'
      pattern: '\b(visa|sponsorship)\b'
    - reason: 'Menciona relocation'
      pattern: '\breloca'
  green_flags:
    - 'worldwide'
    - 'anywhere in the world'
    - 'work from anywhere'
    - '\blatam\b'
    - 'latin america'
    - 'south america'
    - '\bbrazil\b'
  contractor_signals:
    - '\bcontractor\b'
    - 'contract (role|position|basis)'
    - '\bfreelance'
    - '\bb2b\b'
    - '\bdeel\b'
  # Idiomas exigidos que você não domina (inglês e português estão ok)
  language_block:
    - '\b(fluent|fluency|native|proficien\w*|business[- ]level|c1|c2)\b[^.\n]{0,40}\b(german|french|dutch|italian|swedish|danish|norwegian|finnish|polish|czech|japanese|mandarin|chinese|korean|spanish|hebrew|turkish|arabic|russian)\b'
    - '\b(german|french|dutch|italian|swedish|danish|norwegian|finnish|polish|czech|japanese|mandarin|chinese|korean|spanish|hebrew|turkish|arabic|russian)\b[^.\n]{0,25}\b(fluent|fluency|native|c1|c2|required|mandatory)\b'

# ---------------------------------------------------------------------
# Skills. level: have (tenho) | partial (conceitual/curso) | missing
# weight: importância relativa quando a vaga cita a skill
# ---------------------------------------------------------------------
skills:
  - {name: Power BI,      level: have,    weight: 3, patterns: ['power\s?bi']}
  - {name: DAX,           level: have,    weight: 2, patterns: ['\bdax\b']}
  - {name: Power Query,   level: have,    weight: 2, patterns: ['power query', '\bm language\b']}
  - {name: SQL,           level: have,    weight: 3, patterns: ['\bsql\b', 't-sql', '\bmssql\b', 'sql server']}
  - {name: Python,        level: have,    weight: 2, patterns: ['\bpython\b']}
  - {name: pandas,        level: have,    weight: 1, patterns: ['\bpandas\b']}
  - {name: Excel,         level: have,    weight: 2, patterns: ['\bexcel\b', 'spreadsheets?']}
  - {name: VBA,           level: have,    weight: 1, patterns: ['\bvba\b', '\bmacros?\b']}
  - {name: Tableau,       level: have,    weight: 2, patterns: ['\btableau\b']}
  - {name: ETL,           level: have,    weight: 2, patterns: ['\betl\b', '\belt\b']}
  - {name: Data modeling, level: have,    weight: 2, patterns: ['data model(l)?ing', 'star schema', 'dimensional model', 'semantic model']}
  - {name: Data quality,  level: have,    weight: 1, patterns: ['data quality', 'data governance', 'data integrity']}
  - {name: Git,           level: have,    weight: 1, patterns: ['\bgit\b', '\bgithub\b']}
  - {name: Statistics,    level: partial, weight: 1, patterns: ['a/b test', '\bstatistic', 'hypothesis test']}
  - {name: Snowflake,     level: partial, weight: 1, patterns: ['\bsnowflake\b']}
  - {name: AWS,           level: partial, weight: 1, patterns: ['\baws\b', 'amazon web services']}
  - {name: dbt,           level: missing, weight: 2, patterns: ['\bdbt\b']}
  - {name: Airflow,       level: missing, weight: 1, patterns: ['\bairflow\b']}
  - {name: Looker,        level: missing, weight: 2, patterns: ['\blooker\b']}
  - {name: BigQuery,      level: missing, weight: 2, patterns: ['\bbig\s?query\b']}
  - {name: GCP,           level: missing, weight: 1, patterns: ['\bgcp\b', 'google cloud']}
  - {name: Azure,         level: missing, weight: 1, patterns: ['\bazure\b', '\bsynapse\b', 'data factory', 'microsoft fabric']}
  - {name: Databricks,    level: missing, weight: 1, patterns: ['\bdatabricks\b']}
  - {name: Spark,         level: missing, weight: 1, patterns: ['\bspark\b', '\bpyspark\b']}
  - {name: R,             level: missing, weight: 1, patterns: ['(?-i:\bR\b)(?![&/])']}
  - {name: Qlik,          level: missing, weight: 1, patterns: ['\bqlik']}
  - {name: SSIS/SSRS,     level: missing, weight: 1, patterns: ['\bssis\b', '\bssrs\b']}
  - {name: Machine learning, level: missing, weight: 1, patterns: ['machine learning', '\bml\b']}

# Responsabilidades típicas do seu perfil (quanto mais aparecem, melhor)
responsibilities:
  dashboards:    ['dashboard', '\breport(s|ing)?\b', 'visuali[sz]']
  stakeholders:  ['stakeholder', 'business partners', 'cross-functional']
  pipelines:     ['\betl\b', 'pipeline', 'data integration']
  modeling:      ['data model', 'star schema', 'semantic model']
  kpis:          ['\bkpis?\b', '\bmetrics\b', 'performance tracking']
  automation:    ['automat']
  quality:       ['data quality', 'governance', 'data integrity']
  storytelling:  ['storytelling', '\binsights\b', 'recommendations']

scoring:
  weights: {hard_skills: 40, seniority: 20, responsibilities: 15, nice_to_have: 10, context: 15}
  thresholds: {apply: 75, review: 55}
  responsibilities_for_full_score: 4
  # Linha com um destes termos é "desejável". Se a linha for curta
  # (um título de seção), tudo que vem depois também é desejável.
  nice_to_have_markers:
    - 'nice[- ]to[- ]have'
    - '\bpreferred\b'
    - 'bonus'
    - '\bpluses\b'
    - '\ba plus\b'
    - 'good to have'
    - '\bdesirable\b'
    - '\bideally\b'
  # Títulos de seção que voltam a marcar o texto como obrigatório
  required_section_markers:
    - '^\s*(requirements|minimum qualifications|basic qualifications|qualifications|must[- ]haves?)\b'
    - "^\\s*what you('ll)? (need|bring)"
